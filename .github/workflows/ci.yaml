name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Vet
        run: go vet ./...

      - name: Build (Windows cross-compile)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o bin/peace-breaker-bot.exe .

  govulncheck:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
