# Bot related settings.
bot:
  # The owner discord username of the bot.
  # This is used to ensure that the bot will only follow the commands and API
  # calls given by the provided discord user.
  #
  # Eg.: pinheirolucas
  #
  # Setting mapped to:
  # - CLI Flag: --bot-owner
  # - Environment: BOT_OWNER
  owner: ''

  # The application OAuth token to authenticate with the bot.
  # To create your own application bot follow this official doc: https://discord.com/developers/docs/intro
  #
  # Setting mapped to:
  # - CLI Flag: --bot-token
  # - Environment: BOT_TOKEN
  token: ''

  # Fixes the bot's response language, overriding the invoking Discord
  # server's own locale. Optional — leave blank to follow each server's
  # locale, falling back to English where a server has none set.
  #
  # Eg.: en-US, pt-BR
  #
  # Setting mapped to:
  # - CLI Flag: --bot-locale
  # - Environment: BOT_LOCALE
  locale: ''

# Logging related settings.
log:
  # How much the bot logs. One of debug, info, warn or error (case-insensitive).
  # Defaults to info when blank. debug adds a trace of what the player, clip
  # cache, providers and HTTP API are doing; it never includes the bot token
  # or message content.
  #
  # Setting mapped to:
  # - CLI Flag: --log-level
  # - Environment: LOG_LEVEL
  level: info

# HTTP server related settings.
# This HTTP server exposes an interface for controlling the bot playback and
# retrieving data from MyInstants.
server:
  # The address to bind the HTTP server.
  #
  # Eg.: 0.0.0.0:9001
  #
  # Setting mapped to:
  # - CLI Flag: --server-address
  # - Environment: SERVER_ADDRESS
  address: 0.0.0.0:9001
